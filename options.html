<!DOCTYPE html>
<html>
<head>
  <title>StoreSight Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f9fc;
      color: #111827;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #c94f6d;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #c94f6d;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #b2455f;
    }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      height: 20px;
    }
    .status-success {
      color: #059669;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>StoreSight Configuration</h1>
    <div class="form-group">
      <label for="hf-token">Hugging Face Token</label>
      <input type="password" id="hf-token" placeholder="hf_...">
    </div>
    <button id="save-btn">Save Settings</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
